<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tool sounds</title>
<style>
:root{--bg:#fbf7f4;--ink:#3a2747;--card:#fff;--line:#eadfe6;--pink:#ff7d9a}
@media (prefers-color-scheme:dark){:root{--bg:#1d1724;--ink:#f3eaf5;--card:#2a2233;--line:#3d3248}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;opacity:.75}
table{border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;width:100%;max-width:700px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
button:hover{border-color:var(--pink)}button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.wrap{overflow-x:auto}
</style></head><body>
<h1>Tool sounds</h1>
<p>Click to hear each tool's sounds, at the levels and through the same soft filter the game uses. "While held" loops until you click again.</p>
<div class="wrap"><table id="t"></table></div>
<script type="module">
import { Sound } from '../js/audio.js';
const T = { scrub: 'Wash', pop: 'Pop pimples', chisel: 'Sculpt jaw', mew: 'Sit up', rasp: 'Paint hair', gold: 'Heal scars', polish: 'Glow', nose: 'Nose job',
  circles: 'Dark circles', laser: 'Laser spots', teeth: 'Whiten teeth', iron: 'Iron wrinkles', tweeze: 'Tweezers', tbrush: 'Brush teeth', drill: 'Fill cavities', pliers: 'Pull tooth' };
const HIT = ['pop', 'gold', 'nose', 'laser', 'tweeze', 'pliers'], NOLOOP = ['nose'];
const t = document.getElementById('t');
t.innerHTML = '<tr><th>Tool</th><th>While held</th><th>Action</th><th>Done</th></tr>' + Object.entries(T).map(([k, n]) =>
  `<tr><td>${n}</td><td>${NOLOOP.includes(k) ? '' : `<button data-k="loop" data-t="${k}">play</button>`}</td><td>${HIT.includes(k) ? `<button data-k="hit" data-t="${k}">play</button>` : ''}</td><td><button data-k="done" data-t="${k}">play</button></td></tr>`).join('') +
  '<tr><td>Shared</td><td><button data-k="tick">tick</button></td><td><button data-k="success">well done</button></td><td><button data-k="nope">not yet</button></td></tr>';
const s = new Sound(); let on = null;
t.onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  s.init(); s.resume(); s.music && s.music.gain.setTargetAtTime(0, s.ctx.currentTime, 0.01); s.musicOn = true;
  if (on) { s.toolLoop(on.dataset.t, 0); on.classList.remove('on'); if (on === b) { on = null; return; } on = null; }
  const k = b.dataset.k, id = b.dataset.t;
  if (k === 'loop') { s.toolLoop(id, 1); b.classList.add('on'); on = b; }
  else if (k === 'hit') s.toolHit(id); else if (k === 'done') s.toolDone(id); else s[k]();
};
</script></body></html>
